# squat/generic-device-plugin advertising squat.ai/kvm, as on the prod nodes.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: generic-device-plugin
  namespace: kube-system
  labels: {app.kubernetes.io/name: generic-device-plugin}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: generic-device-plugin}
  template:
    metadata:
      labels: {app.kubernetes.io/name: generic-device-plugin}
    spec:
      priorityClassName: system-node-critical
      nodeSelector: {emulator-hub/kvm: "true"}
      tolerations:
        - {operator: Exists, effect: NoExecute}
        - {operator: Exists, effect: NoSchedule}
      containers:
        - name: generic-device-plugin
          image: squat/generic-device-plugin:latest
          imagePullPolicy: IfNotPresent
          args:
            - --domain
            - squat.ai
            - --device
            - |
              name: kvm
              groups:
                - count: ${KVM_CAPACITY}
                  paths:
                    - path: /dev/kvm
          securityContext: {privileged: true}
          volumeMounts:
            - {name: device-plugin, mountPath: /var/lib/kubelet/device-plugins}
            - {name: dev, mountPath: /dev}
      volumes:
        - name: device-plugin
          hostPath: {path: /var/lib/kubelet/device-plugins}
        - name: dev
          hostPath: {path: /dev}
