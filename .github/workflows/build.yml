name: build

on:
  pull_request:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uvx ruff check src tests
      - run: uvx ruff format --check src tests
      # Generated stubs must match the committed proto.
      - run: ./scripts/gen-grpc.sh && git diff --exit-code src/emulator_hub/_grpc
      - run: uv run pytest -q

  # The emulator image contract (tests/e2e/test_image.py), once per catalog
  # entry: every device with every system image that can boot it. The matrix
  # is generated from catalog.py so it cannot drift.
  catalog-matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.m.outputs.include }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - id: m
        run: |
          uv run --frozen python - >>"$GITHUB_OUTPUT" <<'PY'
          import json
          from emulator_hub.catalog import DEVICES, SYSTEM_IMAGES
          rows = [{"image": spec.package, "device": d}
                  for ff, devs in DEVICES.items() for d in devs
                  for spec in SYSTEM_IMAGES.values() if ff in spec.form_factors]
          print("include=" + json.dumps(rows))
          PY

  emulator-image:
    needs: catalog-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.catalog-matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # ubuntu-latest has ~14 GB free; the emulator image is ~17.5 GB.
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: sudo apt-get install -y -qq adb
      # Lets a container get containerd 2's RLIMIT_NOFILE (1073741816).
      - run: sudo sysctl -w fs.nr_open=1073741816
      - run: docker build -t emulator:ci emulator/
      - name: Image size
        run: |
          docker image inspect -f '{{.Size}}' emulator:ci | awk '{printf "image size: %.1f GB\n", $1/1e9}' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Image contract
        id: contract
        env:
          E2E_IMAGE: emulator:ci
          E2E_SYSTEM_IMAGE: ${{ matrix.image }}
          E2E_DEVICE: ${{ matrix.device }}
        run: uv run --frozen --group e2e pytest tests/e2e/test_image.py -m e2e -o addopts= -rA --timeout=1800
      - name: Boot time
        if: always()
        env:
          DEVICE: ${{ matrix.device }}
          BOOT: ${{ steps.contract.outputs.boot_seconds }}
        run: echo "boot $DEVICE in ${BOOT}s" | tee -a "$GITHUB_STEP_SUMMARY"

  # The full-stack suite gates every release.
  e2e:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/e2e.yml

  image:
    needs: [test, emulator-image, e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - {image: emulator-hub, context: ., file: Dockerfile}
          - {image: emulator-hub-emulator, context: emulator, file: emulator/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/noahchalifour/${{ matrix.image }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
